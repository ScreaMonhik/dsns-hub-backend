version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: dsns-db
    restart: always
    environment:
      POSTGRES_USER: dsns_admin
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: dsns_database
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dsns-redis
    restart: always
    ports:
      - "0.0.0.0:6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio
    container_name: dsns-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dsns_admin
      MINIO_ROOT_PASSWORD: supersecretpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata: